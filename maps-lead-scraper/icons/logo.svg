<!--
  Lead Scraper mark.

  A location pin whose hole is a sheet rather than the usual circle: the map
  going in, the spreadsheet coming out. One silhouette, one idea.

  An earlier version cut rows across the whole pin. It was a better idea on
  paper and a worse mark on screen — the cuts flattened the head and the shape
  stopped reading as a pin at all. The meaning moved into the hole, where it
  cannot damage the outline, and at 16px it simply reads as a pin.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7b85ee" />
      <stop offset="1" stop-color="#4650b8" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#tile)" />
  <!-- A hairline highlight along the top edge: the one gloss the mark gets. -->
  <rect x="0.5" y="0.5" width="127" height="127" rx="28.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.2" />

  <!-- evenodd: the sheet is a hole in the pin, not a shape drawn over it, so
       the tile gradient shows through it unchanged. -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M64 20C48.5 20 36 32.5 36 48c0 21 28 52 28 52s28-31 28-52c0-15.5-12.5-28-28-28z
           M56 38h16a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H56a3 3 0 0 1-3-3V41a3 3 0 0 1 3-3z" />
</svg>
