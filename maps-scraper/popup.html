<!doctype html>
<meta charset="utf-8" />
<title>Maps Lead Scraper</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin-bottom: 8px; font-weight: 500; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    margin-top: 3px;
    padding: 6px 7px;
    font: inherit;
    border: 1px solid rgba(128, 128, 128, 0.45);
    border-radius: 5px;
    background: transparent;
    color: inherit;
  }
  .row { display: flex; gap: 8px; }
  .row > label { flex: 1; }
  .check { display: flex; align-items: flex-start; gap: 7px; font-weight: 400; margin: 10px 0; }
  .check input { margin-top: 2px; }
  .hint { font-size: 11px; opacity: 0.65; font-weight: 400; }
  details { margin: 10px 0; }
  summary { cursor: pointer; font-weight: 500; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    padding: 7px 10px;
    font: inherit;
    font-weight: 500;
    border: 1px solid rgba(128, 128, 128, 0.45);
    border-radius: 5px;
    background: rgba(128, 128, 128, 0.12);
    color: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #status {
    margin-top: 12px;
    padding: 9px;
    border-radius: 5px;
    background: rgba(128, 128, 128, 0.12);
    font-size: 12px;
  }
  #counts { margin-top: 5px; opacity: 0.75; font-size: 11px; }
  .bar { height: 4px; border-radius: 2px; background: rgba(128,128,128,0.25); margin-top: 7px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #1a73e8; transition: width 0.3s; }
</style>

<h1>Maps Lead Scraper</h1>

<label>Category
  <input type="text" id="category" placeholder="clothing shop" />
</label>

<label>City
  <input type="text" id="city" placeholder="Coimbatore" />
</label>

<label class="check">
  <input type="checkbox" id="findEmails" />
  <span>Look for emails on business websites
    <span class="hint">Google Maps has no email field, so this opens each listing's website. Expect roughly a third to succeed, and a much slower run.</span>
  </span>
</label>

<details>
  <summary>Coverage settings</summary>
  <div class="row">
    <label>Grid size
      <input type="number" id="gridSize" value="3" min="1" max="9" step="2" />
    </label>
    <label>Tile size (km)
      <input type="number" id="tileKm" value="3" min="1" max="20" />
    </label>
  </div>
  <div class="row">
    <label>Max listings
      <input type="number" id="maxResults" value="200" min="1" max="5000" />
    </label>
    <label>Zoom
      <input type="number" id="zoom" value="14" min="11" max="17" />
    </label>
  </div>
  <p class="hint">Google shows at most ~120 results per search, so the city is swept as a grid of overlapping searches. A 3×3 grid of 3&nbsp;km tiles covers about 9&nbsp;km across.</p>
</details>

<div class="buttons">
  <button id="start" class="primary">Start</button>
  <button id="stop" disabled>Stop</button>
</div>
<div class="buttons">
  <button id="download" disabled>Download CSV</button>
  <button id="clear">Clear</button>
</div>

<div id="status">Ready.</div>
<div class="bar"><div id="progress"></div></div>
<div id="counts"></div>

<script type="module" src="popup.js"></script>
